<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which Map — Resurgence Quads</title>
<meta name="description" content="Welke map is nu actief in Resurgence Quads? Live countdown met rotatie.">
<meta name="theme-color" content="#0d0f12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ff7a1a'/%3E%3Cpath d='M32 14v18l12 8' stroke='%230d0f12' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0d0f12;
    --panel: #161a20;
    --line: #262c35;
    --text: #eef1f5;
    --muted: #8a93a1;
    --accent: #ff7a1a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  header h1 { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; margin: 0; color: var(--muted); font-weight: 600; }
  header .clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }

  .now {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
  }
  .art { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .art img, .art svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute; top: 12px; left: 12px;
    background: var(--accent); color: #111;
    font-weight: 800; font-size: 12px; letter-spacing: .12em;
    padding: 6px 10px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
  }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #111; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .info { padding: 18px 18px 20px; }
  .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .12em; }
  .name { font-size: clamp(30px, 9vw, 44px); font-weight: 800; margin: 4px 0 14px; line-height: 1.05; }
  .timer-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .timer { font-size: clamp(44px, 15vw, 72px); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; color: var(--accent); }
  .until { color: var(--muted); font-size: 14px; text-align: right; }
  .until b { color: var(--text); display: block; font-size: 16px; }
  .bar { height: 6px; background: var(--line); border-radius: 999px; margin-top: 16px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 1s linear; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 26px 0 10px; font-weight: 600; }
  .queue { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .queue li {
    display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px 8px 8px;
  }
  .thumb { position: relative; width: 96px; aspect-ratio: 16 / 9; border-radius: 9px; overflow: hidden; background: #000; }
  .thumb img, .thumb svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .q-name { font-weight: 700; font-size: 16px; }
  .q-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .q-time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }

  footer { color: var(--muted); font-size: 12px; margin-top: 28px; line-height: 1.5; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Resurgence Quads</h1>
    <span class="clock" id="clock">--:--:--</span>
  </header>

  <section class="now" aria-live="polite">
    <div class="art" id="nowArt"><span class="badge">NU ACTIEF</span></div>
    <div class="info">
      <div class="label">Huidige map</div>
      <div class="name" id="nowName">…</div>
      <div class="timer-row">
        <div class="timer" id="timer">--:--</div>
        <div class="until">Daarna<b id="nextName">…</b></div>
      </div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </section>

  <h2>Komt eraan</h2>
  <ul class="queue" id="queue"></ul>

  <footer>
    Rotatie van 10 minuten per map. Tijden in jouw lokale tijdzone.<br>
    Niet-officiële fanpagina, niet gelieerd aan Activision.
  </footer>
</div>

<script>
  // ===== Instellingen =====
  // Volgorde van de rotatie
  const MAPS = [
    { id: "haunted", name: "Haunted Hollow" },
    { id: "fortune", name: "Fortune's Keep" },
    { id: "rebirth", name: "Rebirth Island" },
  ];
  const SLOT_MS = 10 * 60 * 1000; // 10 minuten per map
  // Ijkpunt: Fortune's Keep startte op vr 16 okt 2026 om 21:10:00 Amsterdamse tijd (19:10 UTC).
  // Loopt de timer een paar seconden voor of achter? Pas dit tijdstip aan.
  const ANCHOR_MS = Date.UTC(2026, 9, 16, 19, 10, 0);
  const ANCHOR_INDEX = 1; // index in MAPS van de map die op het ijkpunt startte

  // ===== Logica =====
  const mod = (n, m) => ((n % m) + m) % m;
  const pad = n => String(n).padStart(2, "0");
  const fmtTime = d => d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });

  function slotAt(t) {
    const elapsed = t - ANCHOR_MS;
    const slot = Math.floor(elapsed / SLOT_MS);
    const start = ANCHOR_MS + slot * SLOT_MS;
    return { index: mod(ANCHOR_INDEX + slot, MAPS.length), start, end: start + SLOT_MS };
  }

  // Afbeelding: eerst /img/<id>.jpg proberen, anders de ingebouwde illustratie
  const imgAvailable = {};
  MAPS.forEach(m => {
    const probe = new Image();
    probe.onload = () => { imgAvailable[m.id] = probe.src; lastKey = ""; render(); };
    probe.src = "img/" + m.id + ".jpg";
  });
  function artFor(id, alt) {
    if (imgAvailable[id]) {
      const img = document.createElement("img");
      img.src = imgAvailable[id]; img.alt = alt;
      return img;
    }
    return document.getElementById("art-" + id).content.firstElementChild.cloneNode(true);
  }

  const $ = id => document.getElementById(id);
  let lastKey = "";

  function render() {
    const now = Date.now();
    const cur = slotAt(now);
    const map = MAPS[cur.index];
    const left = Math.max(0, cur.end - now);
    const secs = Math.ceil(left / 1000);

    $("clock").textContent = new Date(now).toLocaleTimeString("nl-NL");
    $("timer").textContent = pad(Math.floor(secs / 60)) + ":" + pad(secs % 60);
    $("bar").style.width = ((now - cur.start) / SLOT_MS * 100).toFixed(2) + "%";
    document.title = pad(Math.floor(secs / 60)) + ":" + pad(secs % 60) + " · " + map.name;

    // Alleen opnieuw opbouwen als de map wisselt
    const key = cur.start + ":" + Object.keys(imgAvailable).join(",");
    if (key === lastKey) return;
    lastKey = key;

    $("nowName").textContent = map.name;
    $("nextName").textContent = MAPS[mod(cur.index + 1, MAPS.length)].name;
    const art = $("nowArt");
    [...art.querySelectorAll("img, svg")].forEach(n => n.remove());
    art.prepend(artFor(map.id, map.name));

    const q = $("queue");
    q.innerHTML = "";
    for (let i = 1; i <= 5; i++) {
      const start = cur.start + i * SLOT_MS;
      const m = MAPS[mod(cur.index + i, MAPS.length)];
      const li = document.createElement("li");
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      thumb.appendChild(artFor(m.id, m.name));
      const txt = document.createElement("div");
      txt.innerHTML = '<div class="q-name"></div><div class="q-sub"></div>';
      txt.querySelector(".q-name").textContent = m.name;
      txt.querySelector(".q-sub").textContent = "tot " + fmtTime(new Date(start + SLOT_MS));
      const time = document.createElement("div");
      time.className = "q-time";
      time.textContent = fmtTime(new Date(start));
      li.append(thumb, txt, time);
      q.appendChild(li);
    }
  }

  render();
  setInterval(render, 1000);
  // Na terugkomen in de tab (mobiel) meteen bijwerken
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { lastKey = ""; render(); } });
</script>
</body>
</html>
