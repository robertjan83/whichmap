<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which Map — Warzone Resurgence</title>
<meta name="description" content="Which map is live in Warzone Resurgence Solo, Duos or Quads? Live countdown and rotation.">
<meta name="theme-color" content="#0a0b09">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ff7a1a'/%3E%3Cpath d='M32 14v18l12 8' stroke='%230d0f12' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b09;
    --panel: #12140f;
    --line: #2a2e24;
    --text: #e9ecdf;
    --muted: #8b927c;
    --accent: #f2c12e;
    --accent-dim: #f2c12e33;
    --hud: #9fbf5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(ellipse at 50% -10%, #2a2f1f 0%, transparent 60%),
      repeating-linear-gradient(0deg, #ffffff05 0 1px, transparent 1px 4px),
      linear-gradient(#ffffff06 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, #ffffff06 1px, transparent 1px) 0 0 / 32px 32px,
      var(--bg);
    color: var(--text);
    font-family: "Rajdhani", system-ui, sans-serif;
    font-weight: 600;
    min-height: 100vh;
    padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  .logo { display: block; width: min(78%, 360px); height: auto; margin: 6px auto 4px; filter: drop-shadow(0 4px 18px #000); }
  .mode {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-family: "Teko", sans-serif; font-size: 22px; letter-spacing: .24em; text-transform: uppercase;
    color: var(--accent); margin: 2px 0 18px; white-space: nowrap;
  }
  .mode::before, .mode::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--accent)); max-width: 90px; }
  .mode::after { transform: scaleX(-1); }

  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 14px; }
  .modes button {
    font-family: "Teko", sans-serif; font-size: 24px; letter-spacing: .2em; text-transform: uppercase; line-height: 1;
    background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-bottom: 3px solid var(--line);
    padding: 12px 6px 8px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .modes button[aria-pressed="true"] { color: #0a0b09; background: var(--accent); border-color: var(--accent); border-bottom-color: #b8901a; }
  .langs { display: flex; justify-content: center; gap: 6px; margin: -6px 0 16px; }
  .langs button {
    font: inherit; font-family: "Teko", sans-serif; font-size: 16px; letter-spacing: .12em; line-height: 1;
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    padding: 5px 10px 3px; cursor: pointer; min-width: 40px;
  }
  .langs button[aria-pressed="true"] { color: #0a0b09; background: var(--accent); border-color: var(--accent); }
  .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px;
  }
  .statusbar .clock { font-family: "Teko", sans-serif; font-size: 20px; letter-spacing: .08em; color: var(--hud); font-variant-numeric: tabular-nums; }
  .live { display: flex; align-items: center; gap: 8px; color: var(--hud); }
  .live::before { content: ""; width: 8px; height: 8px; background: var(--hud); box-shadow: 0 0 10px var(--hud); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .2; } }

  /* HUD-hoekjes */
  .hud { position: relative; }
  .hud::before, .hud::after {
    content: ""; position: absolute; width: 18px; height: 18px; pointer-events: none; z-index: 3;
    border: 2px solid var(--accent);
  }
  .hud::before { top: -5px; left: -5px; border-right: 0; border-bottom: 0; }
  .hud::after { bottom: -5px; right: -5px; border-left: 0; border-top: 0; }

  .now { background: var(--panel); border: 1px solid var(--line); }
  .art { position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  .art img, .art svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, #12140fee 100%); }
  .badge {
    position: absolute; top: 14px; left: 0; z-index: 2;
    background: var(--accent); color: #0a0b09;
    font-family: "Teko", sans-serif; font-size: 20px; letter-spacing: .14em; line-height: 1;
    padding: 6px 22px 3px 14px;
    clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
  }

  .info { padding: 4px 18px 20px; margin-top: -54px; position: relative; z-index: 2; }
  .label { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .24em; }
  .name {
    font-family: "Teko", sans-serif; font-weight: 700; text-transform: uppercase;
    font-size: clamp(40px, 12vw, 60px); line-height: .9; margin: 4px 0 16px;
    text-shadow: 0 2px 12px #000;
  }
  .timer-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .timer { flex: none; }
  .until { min-width: 0; }
  .timer {
    font-family: "Teko", sans-serif; font-weight: 600;
    font-size: clamp(60px, 19vw, 104px); line-height: .8; font-variant-numeric: tabular-nums;
    color: var(--accent); text-shadow: 0 0 24px var(--accent-dim);
  }
  .timer.urgent { color: #ff4a3d; text-shadow: 0 0 24px #ff4a3d55; animation: pulse 1s infinite; }
  .until { color: var(--muted); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; text-align: right; }
  .until b { color: var(--text); display: block; font-family: "Teko", sans-serif; font-size: 22px; line-height: 1; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .bar { height: 6px; background: var(--line); margin-top: 16px; position: relative; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--accent) 0 8px, #d9a91c 8px 16px); width: 0; transition: width 1s linear; }

  h2 {
    font-family: "Teko", sans-serif; font-weight: 600; font-size: 22px; letter-spacing: .24em;
    text-transform: uppercase; color: var(--text); margin: 30px 0 12px;
    display: flex; align-items: center; gap: 12px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .queue { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .queue li {
    display: grid; grid-template-columns: 104px 1fr auto; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    padding: 8px 14px 8px 8px;
  }
  .queue li:not(:first-child) { border-left-color: var(--line); }
  .thumb { position: relative; width: 104px; aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
  .thumb img, .thumb svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .q-name { font-family: "Teko", sans-serif; font-weight: 600; font-size: 22px; line-height: 1; text-transform: uppercase; }
  .q-sub { color: var(--muted); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; margin-top: 3px; }
  .q-time { font-family: "Teko", sans-serif; font-size: 28px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }

  footer { color: var(--muted); font-size: 12px; letter-spacing: .06em; margin-top: 30px; line-height: 1.6; text-align: center; }
</style>
</head>
<body>

<script>
  // ===== Instellingen =====
  // Beschikbare maps
  const MAPS = [
    { id: "haunted", name: "Haunted Hollow" },
    { id: "fortune", name: "Fortune's Keep" },
    { id: "rebirth", name: "Rebirth Island" },
  ];
  const SLOT_MS = 10 * 60 * 1000; // 10 minuten per map
  // Rotatie per modus. Op het ijkpunt (vr 16 okt 2026, 22:10:00 Amsterdamse tijd = 20:10 UTC)
  // startte order[0]; daarna volgt elke 10 minuten de volgende in de lijst.
  // Loopt de timer een paar seconden voor of achter? Pas REF aan.
  const REF = Date.UTC(2026, 9, 16, 20, 10, 0);
  const MODES = {
    solo:  { label: "Solo",  order: ["rebirth", "haunted", "fortune"], ref: REF },
    duos:  { label: "Duos",  order: ["haunted", "fortune", "rebirth"], ref: REF },
    quads: { label: "Quads", order: ["fortune", "rebirth", "haunted"], ref: REF },
  };
  const BY_ID = Object.fromEntries(MAPS.map(m => [m.id, m]));
  let mode = "quads";

  // ===== Talen / Languages =====
  const I18N = {
    en: { locale: "en-GB", title: "Which Map — Resurgence Quads", live: "Live rotation", active: "NOW LIVE", current: "Current map", next: "Up next", coming: "Coming up", until: "until", foot1: "10 minutes per map. Times in your local time zone.", foot2: "Unofficial fan page, not affiliated with Activision." },
    nl: { locale: "nl-NL", title: "Welke map — Resurgence Quads", live: "Live rotatie", active: "NU ACTIEF", current: "Huidige map", next: "Daarna", coming: "Komt eraan", until: "tot", foot1: "10 minuten per map. Tijden in jouw lokale tijdzone.", foot2: "Niet-officiële fanpagina, niet gelieerd aan Activision." },
    de: { locale: "de-DE", title: "Welche Map — Resurgence Quads", live: "Live-Rotation", active: "JETZT AKTIV", current: "Aktuelle Map", next: "Danach", coming: "Als Nächstes", until: "bis", foot1: "10 Minuten pro Map. Zeiten in deiner lokalen Zeitzone.", foot2: "Inoffizielle Fanseite, nicht mit Activision verbunden." },
    fr: { locale: "fr-FR", title: "Quelle carte — Resurgence Quads", live: "Rotation en direct", active: "EN COURS", current: "Carte actuelle", next: "Ensuite", coming: "À venir", until: "jusqu’à", foot1: "10 minutes par carte. Heures dans ton fuseau horaire local.", foot2: "Page de fans non officielle, non affiliée à Activision." },
    es: { locale: "es-ES", title: "Qué mapa — Resurgence Quads", live: "Rotación en vivo", active: "EN VIVO", current: "Mapa actual", next: "Después", coming: "Próximamente", until: "hasta", foot1: "10 minutos por mapa. Horas en tu zona horaria local.", foot2: "Página de fans no oficial, sin relación con Activision." },
  };
  let lang = "en";
  function detectLang() {
    try { const saved = localStorage.getItem("lang"); if (saved && I18N[saved]) return saved; } catch (e) {}
    const list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
    for (const l of list) { const c = String(l).slice(0, 2).toLowerCase(); if (I18N[c]) return c; }
    return "en";
  }
  function setLang(l, save) {
    lang = l;
    if (save) { try { localStorage.setItem("lang", l); } catch (e) {} }
    document.documentElement.lang = l;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = I18N[l][el.dataset.i18n]; });
    document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === l)));
    lastKey = ""; render();
  }
  function detectMode() {
    try { const q = new URLSearchParams(location.search).get("mode"); if (q && MODES[q.toLowerCase()]) return q.toLowerCase(); } catch (e) {}
    try { const saved = localStorage.getItem("mode"); if (saved && MODES[saved]) return saved; } catch (e) {}
    return "quads";
  }
  function setMode(m, save) {
    mode = m;
    if (save) {
      try { localStorage.setItem("mode", m); } catch (e) {}
      try { const u = new URL(location.href); u.searchParams.set("mode", m); history.replaceState(null, "", u); } catch (e) {}
    }
    document.getElementById("modeName").textContent = MODES[m].label;
    document.querySelectorAll("#modes button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === m)));
    lastKey = ""; render();
  }
  const modeNav = document.getElementById("modes");
  Object.keys(MODES).forEach(m => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.m = m; b.textContent = MODES[m].label;
    b.addEventListener("click", () => setMode(m, true));
    modeNav.appendChild(b);
  });
  const langNav = document.getElementById("langs");
  Object.keys(I18N).forEach(l => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.l = l; b.textContent = l.toUpperCase();
    b.addEventListener("click", () => setLang(l, true));
    langNav.appendChild(b);
  });

  // ===== Logica =====
  const mod = (n, m) => ((n % m) + m) % m;
  const pad = n => String(n).padStart(2, "0");
  const fmtTime = d => d.toLocaleTimeString(I18N[lang].locale, { hour: "2-digit", minute: "2-digit", hour12: false });

  function slotAt(t) {
    const ref = MODES[mode].ref;
    const slot = Math.floor((t - ref) / SLOT_MS);
    const start = ref + slot * SLOT_MS;
    return { index: slot, start, end: start + SLOT_MS };
  }
  const mapOf = i => { const o = MODES[mode].order; return BY_ID[o[mod(i, o.length)]]; };

  // Afbeelding: eerst /img/<id>.jpg proberen, anders de ingebouwde illustratie
  const imgAvailable = {};
  MAPS.forEach(m => {
    const probe = new Image();
    probe.onload = () => { imgAvailable[m.id] = probe.src; lastKey = ""; render(); };
    probe.src = "img/" + m.id + ".jpg";
  });
  function artFor(id, alt) {
    if (imgAvailable[id]) {
      const img = document.createElement("img");
      img.src = imgAvailable[id]; img.alt = alt;
      return img;
    }
    return document.getElementById("art-" + id).content.firstElementChild.cloneNode(true);
  }

  const $ = id => document.getElementById(id);
  let lastKey = "";

  function render() {
    const now = Date.now();
    const cur = slotAt(now);
    const map = mapOf(cur.index);
    const left = Math.max(0, cur.end - now);
    const secs = Math.ceil(left / 1000);

    $("clock").textContent = new Date(now).toLocaleTimeString(I18N[lang].locale, { hour12: false });
    $("timer").textContent = pad(Math.floor(secs / 60)) + ":" + pad(secs % 60);
    $("timer").classList.toggle("urgent", secs <= 60);
    $("bar").style.width = ((now - cur.start) / SLOT_MS * 100).toFixed(2) + "%";
    document.title = pad(Math.floor(secs / 60)) + ":" + pad(secs % 60) + " · " + map.name + " (" + MODES[mode].label + ")";

    // Alleen opnieuw opbouwen als de map wisselt
    const key = mode + ":" + cur.start + ":" + Object.keys(imgAvailable).join(",");
    if (key === lastKey) return;
    lastKey = key;

    $("nowName").textContent = map.name;
    $("nextName").textContent = mapOf(cur.index + 1).name;
    const art = $("nowArt");
    [...art.querySelectorAll("img, svg")].forEach(n => n.remove());
    art.prepend(artFor(map.id, map.name));

    const q = $("queue");
    q.innerHTML = "";
    for (let i = 1; i <= 5; i++) {
      const start = cur.start + i * SLOT_MS;
      const m = mapOf(cur.index + i);
      const li = document.createElement("li");
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      thumb.appendChild(artFor(m.id, m.name));
      const txt = document.createElement("div");
      txt.innerHTML = '<div class="q-name"></div><div class="q-sub"></div>';
      txt.querySelector(".q-name").textContent = m.name;
      txt.querySelector(".q-sub").textContent = I18N[lang].until + " " + fmtTime(new Date(start + SLOT_MS));
      const time = document.createElement("div");
      time.className = "q-time";
      time.textContent = fmtTime(new Date(start));
      li.append(thumb, txt, time);
      q.appendChild(li);
    }
  }

  mode = detectMode();
  setMode(mode, false);
  setLang(detectLang(), false);
  setInterval(render, 1000);
  // Na terugkomen in de tab (mobiel) meteen bijwerken
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { lastKey = ""; render(); } });
</script>
</body>
</html>
