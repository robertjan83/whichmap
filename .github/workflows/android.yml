name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "img/**"
      - "icons/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Copy the web app into the Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp -r img icons android/app/src/main/assets/

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk WhichMap.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest WhichMap.apk \
            --title "WhichMap for Android" \
            --notes "Latest Android build (app + home screen widget). Download WhichMap.apk, open it and allow installing from this source." \
            --target "$GITHUB_SHA"
